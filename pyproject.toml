[project]
name = "aqua-selfpruning"
version = "0.1.0"
description = "From-scratch NumPy autodiff + self-pruning network (AQUA hiring challenge)"
requires-python = ">=3.12"   # numpy 2.5.5 (the version results were made with) needs 3.12+
dependencies = ["numpy==2.5.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
plots = ["matplotlib==3.11.2"]
data = ["scikit-learn==1.9.1"]   # dataset loading only

[tool.pytest.ini_options]
testpaths = ["tests"]
